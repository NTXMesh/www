name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Refresh live community stats a few times a day
    - cron: '17 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble static site
        run: |
          mkdir _site
          rsync -a \
            --exclude='_site' \
            --exclude='_archive' \
            --exclude='archive-astro' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='README.md' \
            --exclude='LICENSE-CONTENT' \
            --exclude='scripts' \
            ./ _site/

      - name: Refresh Discord community stats
        run: |
          data=$(curl -sf "https://discord.com/api/v10/invites/nGeQ8cbSM3?with_counts=true" || true)
          members=$(printf '%s' "$data" | jq -r '.approximate_member_count // empty' 2>/dev/null || true)
          online=$(printf '%s' "$data" | jq -r '.approximate_presence_count // empty' 2>/dev/null || true)
          if [ -n "$members" ]; then
            ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            printf '{\n  "members": %s,\n  "online": %s,\n  "updated": "%s"\n}\n' "$members" "${online:-0}" "$ts" > _site/assets/discord-stats.json
            echo "Discord stats refreshed: $members members, $online online"
            cat _site/assets/discord-stats.json
          else
            echo "Discord fetch failed — deploying committed seed value instead."
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh Google Analytics stats
        env:
          GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID }}
          GA_SA_KEY: ${{ secrets.GA_SA_KEY }}
        run: |
          if [ -z "$GA_SA_KEY" ] || [ -z "$GA_PROPERTY_ID" ]; then
            echo "GA secrets not set yet — keeping committed seed (panel stays 'coming soon')."
            exit 0
          fi
          printf '%s' "$GA_SA_KEY" > "$RUNNER_TEMP/ga-key.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/ga-key.json"
          python -m pip install --quiet google-analytics-data
          if OUT=_site/assets/analytics.json python scripts/fetch_ga.py; then
            echo "Google Analytics stats refreshed."
          else
            echo "GA fetch failed — deploying committed seed instead."
          fi
          rm -f "$RUNNER_TEMP/ga-key.json"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
